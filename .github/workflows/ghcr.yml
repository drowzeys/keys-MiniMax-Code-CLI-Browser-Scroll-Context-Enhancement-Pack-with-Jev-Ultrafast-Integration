name: Publish GHCR image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: drowzeys
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: keys-mcode-enhancement-pack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (CLI runs + patches present in the overlay)
        run: |
          docker run --rm keys-mcode-enhancement-pack:ci -V
          docker run --rm --entrypoint sh keys-mcode-enhancement-pack:ci \
            -c "grep -rq 'context-meter' /opt/mcode/lib/node_modules/@minimax-ai/code && echo PATCHED-BUNDLES-PRESENT"

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          tags: |
            ghcr.io/drowzeys/keys-mcode-continuous-context-browser-decision-enhancement-pack:latest
            ghcr.io/drowzeys/keys-mcode-continuous-context-browser-decision-enhancement-pack:0.4.12-keys1
